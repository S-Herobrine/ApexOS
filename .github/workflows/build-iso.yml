name: Build ApexOS ISOs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which ApexOS Edition to build'
        required: true
        default: 'lowend'
        type: choice
        options:
          - 'lowend'
          - 'standard'
          - 'both'

jobs:
  build-lowend:
    name: Build ApexOS Low-End Edition (< 2GB ISO / 4GB RAM)
    if: github.event_name == 'push' || github.event.inputs.edition == 'lowend' || github.event.inputs.edition == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Freeing runner storage..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-pc-bin grub-efi-amd64-bin \
            isolinux syslinux-utils zram-tools zstd

      - name: Build Low-End ISO (~15-20 mins)
        run: |
          chmod +x build/build-iso-lowend.sh build/hooks/*.sh scripts/*.sh
          sudo bash build/build-iso-lowend.sh

      - name: Upload Low-End ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexOS-1.0-LowEnd-amd64-iso
          path: build/output/*.iso
          retention-days: 14

  build-standard:
    name: Build ApexOS Standard Edition (Full Apps)
    if: github.event.inputs.edition == 'standard' || github.event.inputs.edition == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Freeing runner storage..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-pc-bin grub-efi-amd64-bin \
            isolinux syslinux-utils zstd

      - name: Build Standard ISO (~25-35 mins)
        run: |
          chmod +x build/build-iso-standard.sh build/hooks/*.sh scripts/*.sh
          sudo bash build/build-iso-standard.sh

      - name: Upload Standard ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexOS-1.0-Standard-amd64-iso
          path: build/output/*.iso
          retention-days: 14
