# =============================================================================
# SatasOS — Waydroid Configuration
# =============================================================================
# This file is managed by the SatasOS Android subsystem.  Manual edits will
# be overwritten if you re-run setup-waydroid.sh.
#
# Location: /var/lib/waydroid/waydroid.cfg
# =============================================================================

[properties]
# ─── Display Settings ───────────────────────────────────────────────────────
# Resolution that Android sees inside the container.
persist.waydroid.width = 1920
persist.waydroid.height = 1080

# Display density (DPI).  Common values: 160 (mdpi), 240 (hdpi),
# 320 (xhdpi), 480 (xxhdpi).
persist.waydroid.density = 240

# ─── Multi-Window Mode ──────────────────────────────────────────────────────
# Run each Android app in its own host window rather than a single full-screen
# container.  This gives the best desktop integration experience.
persist.waydroid.multi_windows = true

# Show a cursor on each Android sub-surface (recommended for multi-window).
persist.waydroid.cursor_on_subsurface = true

# Use mouse input directly rather than translating to touch events.
persist.waydroid.fake_touch = false

# ─── GPU / Rendering ────────────────────────────────────────────────────────
# Graphics stack.  Valid gralloc options:
#   default             — software (swiftshader)
#   minigbm_gbm_mesa    — hardware via Mesa (Intel/AMD)
#   gbm                 — generic GBM
ro.hardware.gralloc = minigbm_gbm_mesa

# EGL implementation.  "mesa" for hardware, "swiftshader" for software.
ro.hardware.egl = mesa

# Force GPU composition.
ro.hardware.vulkan = mesa
persist.sys.gpu.rendering = true

# ─── Networking ──────────────────────────────────────────────────────────────
# Enable uevent so Waydroid picks up network changes from the host.
persist.waydroid.uevent = true

# DNS servers (use host resolver by default).
net.dns1 = 8.8.8.8
net.dns2 = 8.8.4.4

# ─── Performance ─────────────────────────────────────────────────────────────
# Allow Waydroid to start in the background before user interaction.
persist.waydroid.background_start = true

# Suspend the container when no Android app is visible (saves CPU).
persist.waydroid.suspend = true

# Disable Waydroid's own status bar in multi-window mode.
persist.waydroid.status_bar = false

# Use host's timezone automatically.
persist.sys.timezone = UTC

# ─── Colour / Accessibility ─────────────────────────────────────────────────
persist.waydroid.invert_colors = false
persist.waydroid.night_mode = false

# ─── Shared Storage ─────────────────────────────────────────────────────────
# Mount points are configured via fstab; see setup-waydroid.sh.
# Default shared folder: ~/SatasOS-Android-Shared → /sdcard/SatasOS-Shared

# ─── Device Identity (Play Store) ───────────────────────────────────────────
# These are set by install-playstore.sh and should not be edited manually.
ro.build.fingerprint = google/redfin/redfin:13/TQ3A.230901.001/10750268:user/release-keys
ro.product.model = Pixel 5
ro.product.manufacturer = Google
ro.product.brand = google
ro.product.name = redfin
ro.product.device = redfin
ro.product.board = redfin
ro.build.product = redfin
ro.build.description = redfin-user 13 TQ3A.230901.001 10750268 release-keys
ro.build.display.id = TQ3A.230901.001
ro.build.type = user
ro.build.tags = release-keys

# ─── Google Apps ─────────────────────────────────────────────────────────────
ro.setupwizard.mode = OPTIONAL
ro.com.google.gmsversion = 13_202304
ro.com.google.clientidbase = android-google
ro.opa.eligible_device = true

# ─── ARM Translation ────────────────────────────────────────────────────────
# Enables ARM binary translation on x86_64 hosts (libhoudini / libndk).
persist.waydroid.compat = true

# ─── Audio ───────────────────────────────────────────────────────────────────
# Route Android audio through PipeWire / PulseAudio.
ro.hardware.audio.primary = default

# ─── Clipboard ──────────────────────────────────────────────────────────────
persist.waydroid.clipboard = true
