# Calamares Custom App Selection Module for ApexOS
# Allows users to select their preferred browsers and productivity packages

groups:
  - name: "Web Browsers"
    description: "Choose one or more web browsers to pre-install:"
    type: check
    packages:
      - name: "Google Chrome"
        package: google-chrome-stable
        selected: true
      - name: "Mozilla Firefox"
        package: firefox
        selected: true
      - name: "Microsoft Edge"
        package: microsoft-edge-stable
        selected: false
      - name: "Opera Browser"
        package: opera-stable
        selected: false

  - name: "Android Subsystem & Google Services"
    description: "Android container execution and Play Store support:"
    type: check
    packages:
      - name: "Waydroid Android 14 Container + Play Store"
        package: waydroid
        selected: true

  - name: "Productivity & Media"
    description: "Essential office and creative tools:"
    type: check
    packages:
      - name: "LibreOffice Suite (Writer, Calc, Impress)"
        package: libreoffice
        selected: true
      - name: "VLC Media Player"
        package: vlc
        selected: true
      - name: "GIMP Image Editor"
        package: gimp
        selected: false
      - name: "Visual Studio Code"
        package: code
        selected: true
